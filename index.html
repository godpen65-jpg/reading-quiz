<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>독서퀴즈 대회 준비 — 효녀 심청 · 콩쥐 팥쥐 · 단군 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2620;
    --ink-soft:#6B5D50;
    --paper:#FBF5E9;
    --paper-2:#F3E9D6;
    --line:#DCCBAE;
    --main:#C0512F;
    --main-deep:#9A3E22;
    --good:#2F7A4E;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum','Malgun Gothic',sans-serif;
    font-size:19px; line-height:1.7;
  }
  .wrap{max-width:640px; margin:0 auto; padding:28px 20px 60px;}
  h1{
    font-family:'Gaegu',cursive; font-weight:700;
    font-size:40px; line-height:1.25; margin:10px 0 4px; color:var(--main-deep);
  }
  .sub{color:var(--ink-soft); font-size:17px; margin:0 0 26px;}
  .rule{border:0; border-top:1px solid var(--line); margin:24px 0;}

  button{font-family:inherit; font-size:18px; cursor:pointer; transition:background .15s ease, color .15s ease;}
  .pick{
    display:block; width:100%; text-align:left;
    background:transparent; border:2px solid var(--line); border-radius:12px;
    padding:16px 18px; margin:0 0 12px; color:var(--ink);
  }
  .pick:hover{border-color:var(--main); background:#fff;}
  .pick b{font-family:'Gaegu',cursive; font-size:26px; color:var(--main-deep); display:block;}
  .pick span{color:var(--ink-soft); font-size:16px;}

  .modes{display:flex; gap:10px; margin:0 0 10px;}
  .modes .mode{
    flex:1; background:transparent; border:2px solid var(--line); border-radius:12px;
    padding:14px 6px; font-family:'Gaegu',cursive; font-size:21px; color:var(--ink-soft);
  }
  .modes .mode:hover{border-color:var(--main);}
  .modes .mode.on{border-color:var(--main); background:var(--main); color:#fff;}
  .lead{color:var(--ink-soft); font-size:17px; margin:0 0 24px; line-height:1.6;}

  .bar{height:8px; background:var(--paper-2); border-radius:99px; overflow:hidden; margin:0 0 8px;}
  .bar > i{display:block; height:100%; background:var(--main); width:0; transition:width .25s ease;}
  .meta{display:flex; justify-content:space-between; font-size:16px; color:var(--ink-soft); margin-bottom:22px;}

  .qbook{font-size:16px; color:var(--main-deep); letter-spacing:.02em; margin-bottom:6px;}
  .qtext{font-family:'Gaegu',cursive; font-weight:700; font-size:31px; line-height:1.45; margin:0 0 22px;}

  input[type=text]{
    width:100%; font-family:'Gaegu',cursive; font-size:28px; padding:12px 14px;
    border:0; border-bottom:3px solid var(--line); background:transparent; color:var(--ink);
    outline:none; margin-bottom:14px;
  }
  input[type=text]:focus{border-bottom-color:var(--main);}

  .go{background:var(--main); color:#fff; border:0; border-radius:10px; padding:13px 26px; font-weight:bold;}
  .go:hover{background:var(--main-deep);}
  .ghost{background:transparent; border:1px solid var(--line); border-radius:10px; padding:11px 16px; color:var(--ink-soft); font-size:16px;}
  .ghost:hover{border-color:var(--main); color:var(--main-deep);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .row.sep{margin-top:18px; padding-top:16px; border-top:1px solid var(--line);}

  .choice{
    display:block; width:100%; text-align:left; background:transparent;
    border:2px solid var(--line); border-radius:12px; padding:13px 16px; margin-bottom:10px; color:var(--ink);
  }
  .choice:hover{border-color:var(--main); background:#fff;}
  .choice.ok{border-color:var(--good); color:var(--good); font-weight:bold;}
  .choice.no{border-color:#CFC6B8; color:#A79C8E;}
  .choice em{font-style:normal; color:var(--main-deep); font-family:'Gaegu',cursive; font-size:23px; margin-right:8px;}

  textarea#essay{
    width:100%; font-family:'Gowun Dodum','Malgun Gothic',sans-serif; font-size:18px; line-height:1.8;
    padding:14px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
    outline:none; resize:vertical; margin-bottom:14px;
  }
  textarea#essay:focus{border-color:var(--main);}
  .model{margin:16px 0 0; padding:16px 18px; background:#fff; border:2px solid var(--line); border-radius:12px; font-size:18px; line-height:1.75;}
  .model b{display:block; font-family:'Gaegu',cursive; font-size:24px; color:var(--main-deep); margin-bottom:6px;}
  .model .tip{margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:16px; color:var(--ink-soft);}
  .say{margin:16px 0 0; font-size:19px; min-height:30px;}
  .say.ok{color:var(--good); font-weight:bold;}
  .say.no{color:var(--main-deep);}
  .hint{margin:14px 0 0; padding:12px 16px; background:var(--paper-2); border-radius:10px; font-size:17px; color:var(--ink-soft);}
  .fade{animation:fade .25s ease-out both;}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .hide{display:none;}

  .score{font-family:'Gaegu',cursive; font-size:56px; color:var(--main-deep); margin:6px 0 0;}
  .stars{font-size:22px; letter-spacing:2px; color:var(--main);}
  .list{margin:20px 0 0; padding:0; list-style:none;}
  .list li{padding:12px 0; border-top:1px solid var(--line); font-size:17px;}
  .list li b{display:block; font-weight:normal; color:var(--ink-soft); font-size:15px;}
  .tag{font-size:15px; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">

<!-- 시작 -->
<section id="start">
  <h1>독서퀴즈 대회<br>연습 문제</h1>
  <p class="sub">효녀 심청 · 콩쥐 팥쥐 · 단군 이야기</p>
  <hr class="rule">
  <div class="modes" id="modes">
    <button class="mode on" data-mode="write">✏️ 주관식</button>
    <button class="mode" data-mode="choice">📋 객관식</button>
    <button class="mode" data-mode="essay">📝 서술형</button>
  </div>
  <p class="lead" id="modeDesc"></p>
  <div id="menu"></div>
</section>

<!-- 문제 -->
<section id="quiz" class="hide">
  <div class="bar"><i id="progbar"></i></div>
  <div class="meta"><span id="progtext"></span><span id="startxt"></span></div>

  <div id="card">
    <div class="qbook" id="qbook"></div>
    <p class="qtext" id="qtext"></p>

    <div id="writeBox">
      <input type="text" id="answer" placeholder="여기에 답을 써 보세요" autocomplete="off">
      <div class="row">
        <button class="go" id="submit">확인!</button>
        <button class="ghost" id="showBtn">보기 보여주세요</button>
      </div>
    </div>

    <div id="choiceBox" class="hide"></div>

    <div id="essayBox" class="hide">
      <textarea id="essay" rows="4" placeholder="생각을 문장으로 써 보세요"></textarea>
      <div class="row"><button class="go" id="modelBtn">예시 답안 보기</button></div>
      <div id="modelBox" class="hide"></div>
      <div class="row hide" id="selfRow">
        <button class="ghost" id="selfOk">비슷하게 썼어요 👍</button>
        <button class="ghost" id="selfNo">더 연습할래요 🙂</button>
      </div>
    </div>
    <div class="row" id="hintRow" style="margin-top:14px;"><button class="ghost" id="hintBtn">힌트 주세요</button></div>
    <div id="hintBox" class="hide"></div>
    <p class="say" id="say"></p>
    <div class="row sep hide" id="nextRow"><button class="go" id="next">다음 문제 →</button></div>
  </div>
</section>

<!-- 결과 -->
<section id="result" class="hide"></section>

</div>

     "곰의 결과와 호랑이의 결과를 둘 다 쓰고, 그 까닭(참았는지 못 참았는지)까지 쓰면 좋아요."],
    ["사람이 된 곰에서부터 우리나라 최초의 나라가 세워지기까지의 과정을 차례대로 써 보세요.",

     "① 웅녀가 됨 ② 환웅과 혼인해 단군을 낳음 ③ 단군이 고조선을 세움"]

const CHEER = ["정답이에요! 대단해요 👏","딩동댕! 잘했어요 ⭐","맞았어요! 책을 잘 읽었네요 📖","완벽해요! 👍","정답! 척척박사네요 🎉"];
const NUDGE = ["아쉬워요. 한 번 더 생각해 볼까요?","조금 달라요. 다시 써 볼까요?","음~ 아니에요. 힌트를 볼까요?"];

const $ = id => document.getElementById(id);
const norm = s => (s||"").replace(/[\s()（）·,.'"?!~\-\/]/g,"").toLowerCase();
const pick = a => a[Math.floor(Math.random()*a.length)];

let list = [], idx = 0, stars = 0, wrong = [], showed = false, done = false, mode = "write";

const MODE_DESC = {
  write: "답을 <b>직접 써서</b> 맞혀요. 어려우면 힌트를 보거나, 보기를 열어 볼 수 있어요.<br>직접 맞히면 별 2개 ★★, 보기를 보고 맞히면 별 1개 ★",
  choice: "<b>보기 세 개 중에서</b> 골라요. 글씨 쓰기가 아직 힘들 때 좋아요.<br>맞히면 별 1개 ★",
  essay: "생각을 <b>문장으로 써 보는</b> 문제예요. 정답이 하나만 있는 게 아니에요.<br>다 쓰면 예시 답안을 열어 스스로 확인해요. 이야기마다 3문제."
};
$("modeDesc").innerHTML = MODE_DESC[mode];
$("modes").onclick = e => {
  const b = e.target.closest(".mode"); if(!b) return;
  mode = b.dataset.mode;
  $("modes").querySelectorAll(".mode").forEach(m => m.classList.toggle("on", m === b));
  $("modeDesc").innerHTML = MODE_DESC[mode];
  renderMenu();
};

// 시작 화면 메뉴
function renderMenu(){
  const n = mode === "essay" ? 3 : 15;
  const menuData = [
    ["sim","효녀 심청", n + "문제"],
    ["kong","콩쥐 팥쥐", n + "문제"],
    ["dan","단군 이야기", n + "문제"],
    ["all","세 가지 모두 도전!", (n*3) + "문제 · 대회 실전 연습"]
  ];
  $("menu").innerHTML = menuData.map(m =>
    `<button class="pick" data-key="${m[0]}"><b>${m[1]}</b><span>${m[2]}</span></button>`).join("");
}
renderMenu();
$("menu").onclick = e => {
  const b = e.target.closest(".pick"); if(!b) return;
  start(b.dataset.key);
};

function build(key){
  const keys = key === "all" ? ["sim","kong","dan"] : [key];
  const src = mode === "essay" ? ESSAY : BOOKS;
  const out = [];
  keys.forEach(k => src[k].q.forEach(q => out.push(
    mode === "essay"
      ? {book:src[k].name, t:q[0], a:[q[1]], tip:q[2]}
      : {book:src[k].name, t:q[0], a:q[1], c:q[2], h:q[3]}
  )));
  return out;
}

function start(key){
  list = build(key); idx = 0; stars = 0; wrong = []; done = false;
  $("start").classList.add("hide"); $("result").classList.add("hide"); $("quiz").classList.remove("hide");
  render();
}

function render(){
  const q = list[idx];
  showed = false; done = false;
  $("progbar").style.width = (idx/list.length*100) + "%";
  $("progtext").textContent = `${idx+1} / ${list.length}번`;
  $("startxt").textContent = `모은 별 ${stars}개`;
  $("qbook").textContent = q.book;
  $("qtext").textContent = q.t;
  $("card").classList.remove("fade"); void $("card").offsetWidth; $("card").classList.add("fade");

  $("writeBox").classList.remove("hide");
  $("choiceBox").classList.add("hide"); $("choiceBox").innerHTML = "";
  $("hintBox").classList.add("hide"); $("hintBox").textContent = "";
  $("nextRow").classList.add("hide");
  $("say").textContent = ""; $("say").className = "say";
  $("answer").value = ""; $("answer").disabled = false;
  $("writeBox").querySelectorAll("button").forEach(b => b.disabled = false);

  $("essayBox").classList.add("hide");
  $("modelBox").classList.add("hide"); $("modelBox").innerHTML = "";
  $("selfRow").classList.add("hide");
  $("modelBtn").disabled = false;
  $("essay").value = "";
  $("hintRow").classList.toggle("hide", mode === "essay");

  if(mode === "choice"){
    $("writeBox").classList.add("hide");
    showChoices();
  } else if(mode === "essay"){
    $("writeBox").classList.add("hide");
    $("essayBox").classList.remove("hide");
    $("essay").focus();
  } else {
    $("answer").focus();
  }
}

function finishQ(got){
  done = true;
  stars += got;
  if(got === 0) wrong.push(list[idx]);
  $("startxt").textContent = `모은 별 ${stars}개`;
  $("nextRow").classList.remove("hide");
  $("next").focus();
}

// 주관식 채점
$("submit").onclick = () => {
  if(done) return;
  const v = $("answer").value.trim();
  if(!v){ $("answer").focus(); return; }
  const q = list[idx];
  if(q.a.some(a => norm(a) === norm(v))){
    $("say").textContent = pick(CHEER) + "  ★★";
    $("say").className = "say ok";
    $("answer").disabled = true;
    $("writeBox").querySelectorAll("button").forEach(b => b.disabled = true);
    finishQ(2);
  } else {
    $("say").textContent = pick(NUDGE);
    $("say").className = "say no";
    $("answer").select();
  }
};
$("answer").addEventListener("keydown", e => { if(e.key === "Enter") $("submit").click(); });

// 힌트
$("hintBtn").onclick = () => {
  $("hintBox").textContent = "💡 " + list[idx].h;
  $("hintBox").className = "hint fade";
};

// 보기 보여주기
$("showBtn").onclick = showChoices;

function showChoices(){
  if(showed) return;
  showed = true;
  const q = list[idx];
  $("writeBox").classList.add("hide");
  $("say").textContent = mode === "choice"
    ? "정답을 골라 보세요."
    : "보기 중에서 골라 보세요. (맞히면 별 1개 ★)";
  $("say").className = "say";
  const nums = ["①","②","③"];
  $("choiceBox").innerHTML = q.c.map((c,i) =>
    `<button class="choice" data-i="${i}"><em>${nums[i]}</em>${c}</button>`).join("");
  $("choiceBox").className = "fade";
  $("choiceBox").onclick = e => {
    const b = e.target.closest(".choice"); if(!b || done) return;
    const chosen = q.c[+b.dataset.i];
    const isOk = q.a.some(a => norm(a) === norm(chosen));
    $("choiceBox").querySelectorAll(".choice").forEach(el => {
      const txt = q.c[+el.dataset.i];
      if(q.a.some(a => norm(a) === norm(txt))) el.classList.add("ok");
      else el.classList.add("no");
    });
    if(isOk){
      $("say").textContent = "정답이에요! 별 1개 ★";
      $("say").className = "say ok";
      finishQ(1);
    } else {
      $("say").textContent = "정답은 초록색으로 표시된 것이에요. 다음에 꼭 맞혀요!";
      $("say").className = "say no";
      finishQ(0);
    }
  };
}

// 서술형 — 예시 답안 보고 스스로 확인
$("modelBtn").onclick = () => {
  const q = list[idx];
  $("modelBox").innerHTML = "<b>예시 답안</b>" + q.a[0] +
    "<div class='tip'>💡 이런 내용이 들어가면 좋아요 — " + q.tip + "</div>";
  $("modelBox").className = "model fade";
  $("modelBtn").disabled = true;
  $("selfRow").classList.remove("hide");
  $("say").textContent = "내가 쓴 것과 견주어 볼까요?";
  $("say").className = "say";
};
$("selfOk").onclick = () => {
  if(done) return;
  $("say").textContent = "잘했어요! 생각을 문장으로 잘 썼네요 ★";
  $("say").className = "say ok";
  finishQ(1);
};
$("selfNo").onclick = () => {
  if(done) return;
  $("say").textContent = "괜찮아요. 마지막에 이 문제만 다시 볼게요.";
  $("say").className = "say no";
  finishQ(0);
};

$("next").onclick = () => {
  idx++;
  if(idx < list.length) render(); else showResult();
};

function showResult(){
  $("quiz").classList.add("hide");
  const max = list.length * (mode === "write" ? 2 : 1);
  const isEssay = mode === "essay";
  const wordWrong = isEssay ? "다시 볼 문제" : "틀린 문제";
  const wordAns = isEssay ? "예시 답안" : "정답";
  const pct = Math.round(stars / max * 100);
  let msg;
  if(pct === 100) msg = "완벽해요! 대회 나가도 되겠어요 🏆";
  else if(pct >= 80) msg = "아주 잘했어요! 조금만 더 하면 완벽해요 🎉";
  else if(pct >= 50) msg = "잘하고 있어요! 틀린 문제만 한 번 더 풀어 볼까요? 💪";
  else msg = "괜찮아요. 책을 한 번 더 읽고 다시 도전해 봐요 📖";

  let html = `<h1>다 풀었어요!</h1>
    <p class="sub">${msg}</p><hr class="rule">
    <p class="tag">모은 별</p>
    <p class="score">${stars} <span style="font-size:26px;color:var(--ink-soft)">/ ${max}개</span></p>
    <p class="stars">${"★".repeat(Math.min(20, Math.round(stars/max*20)))}${"☆".repeat(20-Math.min(20,Math.round(stars/max*20)))}</p>`;

  if(wrong.length){
    html += `<hr class="rule"><p style="font-family:'Gaegu',cursive;font-size:26px;margin:0 0 4px;">${wordWrong} ${wrong.length}개</p>
      <ul class="list">` + wrong.map(w =>
        `<li><b>${w.book}</b>${w.t}<br><span style="color:var(--main-deep)">${wordAns}: ${w.a[0]}</span></li>`).join("") + `</ul>`;
  }
  html += `<div class="row sep">
      ${wrong.length ? `<button class="go" id="again">${isEssay ? "이 문제만 다시 써 보기" : "틀린 문제만 다시 풀기"}</button>` : ""}
      <button class="ghost" id="home">처음으로</button>
    </div>`;

  $("result").innerHTML = html;
  $("result").classList.remove("hide");
  window.scrollTo(0,0);

  if($("again")) $("again").onclick = () => {
    list = wrong.slice(); idx = 0; stars = 0; wrong = [];
    $("result").classList.add("hide"); $("quiz").classList.remove("hide");
    render();
  };
  $("home").onclick = () => {
    $("result").classList.add("hide"); $("start").classList.remove("hide");
  };
}
</script>

})();
